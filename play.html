<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>윤평화 — Play</title>
<meta name="description" content="윤평화 포트폴리오 인터랙션 버전. 프로젝트들이 기술로 이어진 지도에서 하나를 고르고, 그 프로젝트의 핵심을 직접 만져 봅니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#0A0A0B;--panel:#141416;--line:#26262b;--red:#FF2D3D;--deep:#7A0F18;--fg:#EDEDED;--dim:#8A8A92;--ok:#4ade80;
  --sans:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;--disp:'Space Grotesk',var(--sans);--mono:'JetBrains Mono',Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.m{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.r{color:var(--red)}
#bgc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

/* ── 지도 화면 ── */
#home{position:fixed;inset:0;display:flex;flex-direction:column;padding:18px clamp(16px,4vw,48px) 20px;transition:opacity .3s,transform .4s}
body.in #home{opacity:0;transform:scale(1.04);pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top a:hover{color:var(--red)}
.intro{margin:clamp(8px,2.5vh,26px) 0 0}
.intro h1{font-family:var(--disp);font-size:clamp(24px,3.6vw,48px);line-height:1.12;letter-spacing:-.03em;margin:8px 0 6px}
.intro p{margin:0;color:var(--dim);font-size:clamp(13px,1.3vw,16px)}
#map{position:relative;flex:1;min-height:0;margin:8px 0}
#map svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#map svg .path{stroke:#34343a;stroke-width:1.5;stroke-dasharray:4 7;fill:none}
#map svg .link{stroke:var(--red);stroke-width:2.5;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(255,45,61,.6))}
.node{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;text-align:center;width:clamp(96px,11vw,150px);transition:opacity .25s,transform .25s}
.node .th{display:block;width:100%;aspect-ratio:1;border-radius:50%;border:2px solid #3a3a40;background:#141416 center/cover;transition:.25s;position:relative;overflow:hidden}
.node .th i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-style:normal;font-size:38px;color:var(--red)}
.node b{display:block;margin-top:9px;font-size:clamp(13px,1.2vw,16px);line-height:1.2}
.node .m{display:block;font-size:10.5px;margin-top:2px}
.node .num{position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:var(--bg);border:1px solid #3a3a40;font-family:var(--mono);font-size:11px;padding:1px 7px;z-index:1}
.node:hover{transform:translate(-50%,-50%) scale(1.07)}
.node:hover .th,.node.hot .th{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,45,61,.25),0 0 40px -6px rgba(255,45,61,.7)}
#map.filter .node:not(.hot){opacity:.25}
#techs{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-items:center}
#techs button{background:none;border:1px solid #2f2f34;padding:8px 13px;font-size:13.5px;font-weight:600;color:#b0b0b8;transition:.2s}
#techs button:hover{border-color:#5a5a62;color:#fff}
#techs button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#0A0A0B}
#techs small{font-family:var(--mono);font-size:10.5px;opacity:.7;margin-left:5px}
.foot{text-align:center;margin-top:10px}

/* ── 프로젝트 화면 ── */
#stage{position:fixed;inset:0;display:flex;flex-direction:column;padding:14px clamp(14px,3vw,40px) 16px;opacity:0;pointer-events:none;transform:translateY(16px);transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1)}
body.in #stage{opacity:1;pointer-events:auto;transform:none}
.sh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sh .back{background:var(--red);border:0;color:#0A0A0B;font-weight:700;font-size:13.5px;padding:9px 14px}
.sh .explore-link{font-size:13.5px;padding:9px 4px;color:#dedee4}
.sh .explore-link:hover{color:var(--red)}
#mini{display:flex;gap:6px;flex-wrap:wrap}
#mini button{background:none;border:1px solid #2A2A2E;padding:8px 11px;font-size:13px;font-weight:600;color:#9a9aa2;transition:.2s}
#mini button:hover{color:#fff;border-color:#5a5a62}
#mini button[aria-current=true]{border-color:var(--red);color:#fff;background:rgba(255,45,61,.12)}
#mini kbd{font-family:var(--mono);font-size:10.5px;color:var(--red);margin-right:6px}
.sb{flex:1;min-height:0;display:grid;grid-template-columns:1.5fr 1fr;gap:clamp(14px,2.4vw,32px)}
.toy{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);background:var(--panel)}
.tt{padding:14px 18px;border-bottom:1px solid var(--line)}
.tt b{font-family:var(--disp);font-size:clamp(17px,1.8vw,22px)}
.tt span{display:block;color:var(--dim);font-size:13.5px;margin-top:3px;line-height:1.45}
#box{position:relative;flex:1;min-height:220px;overflow:hidden;touch-action:none}
#box canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);min-height:58px}
#ctl button{background:none;border:1px solid #3a3a40;padding:8px 13px;font-size:13.5px;font-weight:600;transition:.2s}
#ctl button:hover{border-color:var(--red);color:var(--red)}
#ctl button.on{background:var(--red);border-color:var(--red);color:#0A0A0B}
#ctl button.fix.on{background:var(--ok);border-color:var(--ok)}
#ctl .stat{font-family:var(--mono);font-size:12.5px;color:var(--dim);margin-left:auto}
#ctl .stat b{color:#fff}
#ctl label{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:8px}
#ctl input[type=range]{accent-color:var(--red);width:120px}
aside{overflow:auto;padding-right:4px}
aside h2{font-family:var(--disp);font-size:clamp(30px,4vw,56px);line-height:1;letter-spacing:-.03em;margin:8px 0 12px}
aside p{color:#c9c9cf;font-size:15.5px;line-height:1.6;margin:0 0 16px}
aside p b{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.chips span,.chips button{border:1px solid #2f2f34;background:#101012;padding:7px 12px;font-size:13.5px;font-weight:600}
.chips button:hover{border-color:var(--red);color:var(--red)}
.lesson{border-left:2px solid var(--red);padding:2px 0 2px 14px;margin:0 0 18px;font-size:14.5px;color:#c9c9cf;line-height:1.55}
.nextp{display:block;width:100%;text-align:left;background:#101012;border:1px solid var(--line);padding:14px 16px;margin-bottom:16px;transition:.2s}
.nextp:hover{border-color:var(--red)}
.nextp b{display:block;font-size:16px;margin-top:4px}
.nextp span{display:block;color:var(--dim);font-size:13.5px;margin-top:4px;line-height:1.5}
.cta{display:flex;flex-wrap:wrap;gap:8px}
.btn{font-family:var(--mono);font-size:13px;font-weight:700;padding:11px 16px;border:1px solid #3A3A3F;transition:.2s}
.btn:hover{border-color:var(--red);color:var(--red)}
.btn.p{background:var(--red);border-color:var(--red);color:#0A0A0B}

/* 놀이: 가방 */
.bagwrap{position:absolute;inset:0;display:flex;gap:18px;align-items:center;justify-content:center;padding:16px;flex-wrap:wrap}
.bag{display:grid;grid-template-columns:repeat(4,clamp(44px,5.4vw,64px));gap:6px}
.slot{aspect-ratio:1;border:1px solid #34343a;background:#0f0f11;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;padding:0;transition:.2s}
.slot.off{opacity:.18;border-style:dashed}
.slot.it{color:#0A0A0B}
.slot.sel{outline:2px solid #fff;outline-offset:2px}
.slot.gone{animation:gone .5s forwards}
@keyframes gone{to{transform:scale(.2);opacity:0}}
.chest{border:1px dashed var(--ok);padding:10px;min-width:120px;text-align:center}
.chest .bag{grid-template-columns:repeat(3,44px);margin-top:8px}
/* 놀이: 늦은 접속 */
.net{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px;align-items:center}
.scr{border:1px solid #34343a;background:#0f0f11;padding:12px;text-align:center;transition:.3s}
.scr.offl{opacity:.35}
.scr.bad{border-color:var(--red);box-shadow:0 0 30px -8px var(--red)}
.scr.good{border-color:var(--ok)}
.door{position:relative;height:clamp(90px,16vh,150px);margin:10px auto;max-width:220px;background:#1b2a3a;overflow:hidden;border:2px solid #44444c}
.door i{position:absolute;top:0;bottom:0;width:50%;background:#5c6b7c;border:1px solid #2a323c;transition:transform .5s}
.door i:first-child{left:0}.door i:last-child{right:0}
.door.open i:first-child{transform:translateX(-92%)}.door.open i:last-child{transform:translateX(92%)}
/* 놀이: 키보드 */
.kb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px}
.kb .out{font-family:var(--mono);font-size:clamp(18px,2.4vw,28px);min-height:1.6em;margin-bottom:12px;border-bottom:2px solid var(--red);padding:0 8px;min-width:60%;text-align:center}
.kb .row{display:flex;gap:5px}
.key{position:relative;width:clamp(26px,3.6vw,46px);aspect-ratio:1;border:1px solid #3a3a40;background:#0f0f11;font-family:var(--mono);font-size:14px;font-weight:700;padding:0;overflow:hidden}
.key.sp{width:clamp(140px,22vw,260px);aspect-ratio:auto;height:clamp(26px,3.6vw,46px)}
.key::after{content:"";position:absolute;left:0;bottom:0;height:100%;width:0;background:rgba(255,45,61,.55);z-index:0}
.key.dw::after{width:100%;transition:width .38s linear}
.key span{position:relative;z-index:1}
.key.hit{background:var(--red);color:#0A0A0B}

@media (max-width:820px){
  html,body{overflow:auto}
  #home,#stage{position:absolute;min-height:100%;inset:0 0 auto 0}
  #map{display:grid;grid-template-columns:1fr 1fr;gap:18px 10px;padding:14px 0}
  #map svg{display:none}
  .node{position:relative;transform:none;left:auto!important;top:auto!important;width:100%;max-width:150px;margin:0 auto}
  .node:hover{transform:none}
  .sb{grid-template-columns:1fr;flex:none}
  #box{min-height:300px}
  body.in #home{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="bgc" aria-hidden="true"></canvas>

<!-- 지도: 모든 프로젝트가 한 화면에, 만든 순서대로 이어져 있다 -->
<main id="home">
  <div class="top"><span class="m" style="color:#fff">YPH<span class="r">.</span>PLAY</span><a class="m" href="index.html">기본 사이트 →</a></div>
  <div class="intro">
    <div class="m"><span class="r">■</span> 윤평화 · Game Client Programmer</div>
    <h1>프로젝트는 따로가 아니라 <span class="r">이어져</span> 있습니다.</h1>
    <p>동그라미를 누르면 바로 열리고, 그 프로젝트의 핵심을 직접 만져 볼 수 있습니다. 아래 기술을 누르면 어디서 어디로 이어졌는지 보입니다.</p>
  </div>
  <div id="map"><svg aria-hidden="true"><path class="path" id="chrono"/><path class="link" id="link"/></svg></div>
  <div id="techs" role="group" aria-label="기술로 연결 보기"></div>
  <div class="m foot">숫자키 <span class="r">1–6</span> 바로 열기 · <span class="r">Esc</span> 지도로</div>
</main>

<!-- 프로젝트: 왼쪽은 직접 만지는 놀이, 오른쪽은 짧은 설명 -->
<section id="stage" aria-live="polite">
  <div class="sh"><button class="back" id="back">← 지도</button><a class="explore-link" href="gate-portfolio.html#explore">포탈 탐험으로</a><div id="mini"></div></div>
  <div class="sb">
    <div class="toy"><div class="tt"><b id="tt"></b><span id="td"></span></div><div id="box"></div><div id="ctl"></div></div>
    <aside id="info"></aside>
  </div>
</section>

<script>
const $=s=>document.querySelector(s),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};

/* ══ 놀이 도구 ══ 각 놀이는 (box, ctl)을 받아 화면을 만들고, 멈추는 함수를 돌려준다 */
function mk(box){const c=el('canvas'),g=c.getContext('2d');box.appendChild(c);let w,h;
  const fit=()=>{const d=Math.min(devicePixelRatio||1,2);w=box.clientWidth;h=box.clientHeight;c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0)};fit();
  const ro=new ResizeObserver(fit);ro.observe(box);
  return {c,g,get w(){return w},get h(){return h},off:()=>ro.disconnect()}}
function loop(fn){let id,last=performance.now(),on=true;(function f(t){if(!on)return;id=requestAnimationFrame(f);fn(Math.min(.05,(t-last)/1000),t);last=t})(last);return()=>{on=false;cancelAnimationFrame(id)}}
const btn=(ctl,label,fn,cls)=>{const b=el('button',cls,label);b.onclick=()=>fn(b);ctl.appendChild(b);return b};
const stat=ctl=>{const s=el('span','stat');ctl.appendChild(s);return s};
function sparks(){const a=[];return{add(x,y,n,col){for(let i=0;i<n;i++){const t=Math.random()*6.28,v=60+Math.random()*320;a.push({x,y,vx:Math.cos(t)*v,vy:Math.sin(t)*v,l:1,col})}},
  draw(g,dt){for(const p of a){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;p.l-=dt*1.6;g.globalAlpha=Math.max(0,p.l);g.fillStyle=p.col;g.fillRect(p.x-2,p.y-2,4,4)}g.globalAlpha=1;
    for(let i=a.length-1;i>=0;i--)if(a[i].l<=0)a.splice(i,1)}}}
const ring=(g,x,y,r,col,lw)=>{g.beginPath();g.arc(x,y,Math.max(0,r),0,6.283);g.strokeStyle=col;g.lineWidth=lw;g.stroke()};
const text=(g,s,x,y,sz,col,al='center')=>{g.font=`700 ${sz}px Pretendard,sans-serif`;g.textAlign=al;g.fillStyle=col;g.fillText(s,x,y)};

/* 1. 철과 묵 — 받아치기: 줄어드는 원이 과녁에 닿는 순간(±0.1초) 누른다 */
function toyParry(box,ctl){const K=mk(box),g=K.g,sp=sparks(),T=1.3,WIN=.1;let t=-.6,res='',resT=0,stop=0,streak=0,steam=0,best=0,flash=0;
  const st=stat(ctl);const upd=()=>st.innerHTML=`연속 <b>${streak}</b> · 최고 <b>${best}</b> · 판정 <b>±0.1초</b>`;upd();
  const hit=()=>{if(t<0||res)return;const d=t-T;if(Math.abs(d)<=WIN){res='받아치기!';streak++;best=Math.max(best,streak);steam=Math.min(1,steam+.25);stop=.12;sp.add(K.w/2,K.h/2,70,'#FF2D3D');
      if(steam>=1){flash=1;steam=0;res='강공격!';sp.add(K.w/2,K.h/2,160,'#fff')}}
    else{res=d<0?`빨랐다 (${(-d).toFixed(2)}초)`:`늦었다 (${d.toFixed(2)}초)`;streak=0}resT=.9;upd()};
  const key=e=>{if(e.code==='Space'){e.preventDefault();hit()}};addEventListener('keydown',key);K.c.addEventListener('pointerdown',hit);
  const end=loop(dt=>{const w=K.w,h=K.h,cx=w/2,cy=h/2,R=Math.min(w,h)*.13;
    if(stop>0){stop-=dt;dt=0} // 히트스탑: 성공한 순간 시간을 잠깐 멈춤
    if(res){resT-=dt;if(resT<=0){res='';t=-.5-Math.random()*.6}}else{t+=dt;if(t>T+WIN+.02){res='놓쳤다';streak=0;resT=.8;upd()}}
    g.clearRect(0,0,w,h);if(flash>0){g.fillStyle=`rgba(255,45,61,${flash*.35})`;g.fillRect(0,0,w,h);flash-=dt*2}
    g.fillStyle='#7A0F18';g.beginPath();g.arc(cx,cy,R*.55,0,6.283);g.fill();ring(g,cx,cy,R,'#fff',3);
    if(t>=0&&!res){const p=t/T,rr=R+(1-Math.min(1,p))*Math.min(w,h)*.36;ring(g,cx,cy,rr,Math.abs(t-T)<=WIN?'#FF2D3D':'#8A8A92',Math.abs(t-T)<=WIN?6:3)}
    sp.draw(g,dt||.016);
    if(res)text(g,res,cx,cy-R-26,26,/치기|강공격/.test(res)?'#FF2D3D':'#8A8A92');
    // 증기 게이지: 받아칠 때마다 차고, 가득 차면 강공격
    const bw=Math.min(260,w*.5);g.fillStyle='#232327';g.fillRect(cx-bw/2,h-34,bw,8);g.fillStyle='#FF2D3D';g.fillRect(cx-bw/2,h-34,bw*steam,8);text(g,'증기',cx-bw/2-10,h-26,12,'#8A8A92','right');
    text(g,'화면을 누르거나 Space',cx,26,13,'#8A8A92')});
  return()=>{end();K.off();removeEventListener('keydown',key)}}

/* 2. Grimoire — 시계 두 개와 한 개: 보이는 링과 실제 판정이 어긋나는 이유 */
function toyClocks(box,ctl){const K=mk(box),g=K.g,sp=sparks(),T=1.2,WIN=.12;let one=false,spd=1,t=-.4,res='',resT=0;
  const bm=btn(ctl,'',b=>{one=!one;lab()},'fix');const lab=()=>{bm.textContent=one?'시계 1개 (수정 후)':'시계 2개 (버그)';bm.classList.toggle('on',one);gap()};
  const sb=[.5,1,2].map(v=>btn(ctl,v+'×',()=>{spd=v;sb.forEach((b,i)=>b.classList.toggle('on',[.5,1,2][i]===v));gap()}));sb[1].classList.add('on');
  const st=stat(ctl);const real=()=>T/spd,vis=()=>one?T/spd:T; // 판정은 애니메이션 시간, 링은 (버그일 때) 따로 도는 시계
  const gap=()=>{const d=Math.abs(vis()-real());st.innerHTML=`어긋남 <b style="color:${d>.01?'#FF2D3D':'#4ade80'}">${d.toFixed(2)}초</b>`};lab();
  const hit=()=>{if(t<0||res)return;const ok=Math.abs(t-real())<=WIN,ring_ok=Math.abs(t-vis())<=WIN;
    res=ok?'패링 성공':ring_ok?'링은 맞았는데 판정 실패':'실패';if(ok)sp.add(K.w/2,K.h*.42,60,'#FF2D3D');resT=1.1};
  const key=e=>{if(e.code==='Space'){e.preventDefault();hit()}};addEventListener('keydown',key);K.c.addEventListener('pointerdown',hit);
  const end=loop(dt=>{const w=K.w,h=K.h,cx=w/2,cy=h*.42,R=Math.min(w,h)*.11,fin=Math.max(vis(),real())+.35;
    if(res){resT-=dt;if(resT<=0){res='';t=-.5}}else{t+=dt;if(t>fin){t=-.5}}
    g.clearRect(0,0,w,h);g.fillStyle='#7A0F18';g.beginPath();g.arc(cx,cy,R*.55,0,6.283);g.fill();ring(g,cx,cy,R,'#fff',3);
    if(t>=0){const p=Math.min(1,t/vis());ring(g,cx,cy,R+(1-p)*Math.min(w,h)*.3,'#EDEDED',3)}
    sp.draw(g,dt);if(res)text(g,res,cx,cy-R-22,22,res==='패링 성공'?'#4ade80':'#FF2D3D');

function toySwarm(box,ctl){const K=mk(box),g=K.g,sp=sparks();let pool=true,want=80,sat=2,made=0,reused=0,px=0,py=0,tx=null,ty=null,ang=0;const mobs=[];

  const end=loop(dt=>{const w=K.w,h=K.h;if(tx==null){tx=px=w/2;ty=py=h/2}px+=(tx-px)*.18;py+=(ty-py)*.18;ang+=dt*2.6;
